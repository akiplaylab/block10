<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#83d7ff">
    <meta name="apple-mobile-web-app-title" content="ブロック 10">
    <meta name="description" content="数の組み合わせを楽しく学び、計算力の土台をつくる算数学習ゲーム。">
    <meta property="og:title" content="ブロック 10 | 遊んで学ぶ足し算">
    <meta property="og:description" content="数の組み合わせを楽しく学び、計算力の土台をつくる算数学習ゲーム。">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://akiplaylab.github.io/block10/">
    <meta property="og:url" content="https://akiplaylab.github.io/block10/">
    <meta property="og:image" content="https://akiplaylab.github.io/block10/ogp.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="虹と雲を背景にした「ブロック 10」のロゴ、7 + ? = 10 の式、青7個とオレンジ3個のブロック、ピンクの「あそぶ」ボタン">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ブロック 10 | 遊んで学ぶ足し算">
    <meta name="twitter:description" content="数の組み合わせを楽しく学び、計算力の土台をつくる算数学習ゲーム。">
    <meta name="twitter:image" content="https://akiplaylab.github.io/block10/ogp.png">
    <meta name="twitter:image:alt" content="虹と雲を背景にした「ブロック 10」のロゴ、7 + ? = 10 の式、青7個とオレンジ3個のブロック、ピンクの「あそぶ」ボタン">
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <title>ブロック 10 | あそんで まなぶ たしざん</title>
  </head>
  <body>
    <div class="scenery" aria-hidden="true">
      <div class="sky-rainbow"></div>
      <div class="cloud cloud-left"></div><div class="cloud cloud-right"></div>
      <div class="cloud cloud-bottom-left"></div><div class="cloud cloud-bottom-right"></div>
      <span class="sky-star star-one">✦</span><span class="sky-star star-two">✦</span>
      <span class="sky-star star-three">✦</span><span class="sky-star star-four">✦</span>
    </div>
    <header>
      <button id="home" class="utility" type="button" hidden><span aria-hidden="true">⌂</span> ホーム</button>
      <div id="score" class="score" aria-live="polite" hidden></div>
      <button id="settings-open" class="utility" type="button" aria-label="せってい">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
          <path d="M10 2h4l.6 2.5 2.1 1.2 2.5-.7 2 3.5-1.9 1.8v2.4l1.9 1.8-2 3.5-2.5-.7-2.1 1.2L14 21h-4l-.6-2.5-2.1-1.2-2.5.7-2-3.5 1.9-1.8v-2.4L2.8 8.5l2-3.5 2.5.7 2.1-1.2z" transform="translate(0 .5)"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </header>
    <main>
      <section id="title" class="title-screen">
        <h1 class="logo" aria-label="ブロック 10">
          <span aria-hidden="true">ブ</span><span aria-hidden="true">ロ</span><span aria-hidden="true">ッ</span><span aria-hidden="true">ク</span><strong aria-hidden="true">10</strong>
        </h1>
        <div class="main-mode">
          <div class="ten-preview">
            <span id="preview-first"></span> <span id="preview-operator"></span> <span>?</span> <span data-operator="="></span> <span id="preview-result"></span>
          </div>
          <div id="ten-blocks" role="img"></div>
          <button id="play-ten" class="primary" type="button" aria-label="10 で あそぶ">あそぶ</button>
        </div>
        <div class="other-modes">
          <p id="other-modes-label">ほかの かずで あそぶ</p>
          <div id="modes" class="modes" role="group" aria-labelledby="other-modes-label">
            <button id="play-random" class="choice" type="button">
              <span>ランダム</span>
              <span id="random-chips" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </section>
      <section id="game" class="game-screen complement" aria-label="ブロック 10" hidden>
        <div class="equation" aria-live="polite" aria-atomic="true">
          <span id="first"></span> <span id="operator"></span> <span id="second"></span> <span data-operator="="></span> <span id="answer">?</span>
        </div>
        <div id="reward" class="reward">
          <div id="board" class="board frame" role="img"></div>
          <div id="result" class="result" role="status" hidden><span aria-hidden="true">✦</span> できた！ <span aria-hidden="true">✦</span></div>
        </div>
        <div class="feedback">
          <p id="feedback" role="status"></p>
          <div id="overflow" class="overflow" aria-hidden="true"></div>
        </div>
        <div class="turn">
          <div id="supply" class="supply"></div>
        </div>
        <div class="actions">
          <button id="next" class="primary" type="button" hidden>つぎへ</button>
        </div>
      </section>
    </main>
    <dialog id="settings" class="settings-dialog" aria-labelledby="settings-title">
      <h2 id="settings-title">せってい</h2>
      <button id="sound" class="utility sound" type="button" aria-label="おと" aria-pressed="true">
        <span class="speaker" aria-hidden="true"></span><span id="sound-state" aria-hidden="true">オン</span>
      </button>
      <fieldset>
        <legend>こたえかた</legend>
        <label class="answer-option">
          <input type="radio" name="answer-method" value="blocks">
          <span>ブロックつき</span>
          <span class="method-preview" aria-hidden="true">
            <span><span data-preview-first></span> <span data-preview-operator></span> ? = <span data-preview-result></span></span>
            <span class="preview-tiles">
              <i class="block blue"></i><i class="block blue"></i><i class="block blue"></i><i class="block blue"></i>
              <i class="block blue"></i><i class="block blue"></i><i class="block blue"></i>
              <i class="slot"></i><i class="slot"></i><i class="slot"></i>
            </span>
            <span class="preview-choices">
              <b>2 <i class="block orange"></i><i class="block orange"></i></b>
              <b>3 <i class="block orange"></i><i class="block orange"></i><i class="block orange"></i></b>
              <b>4 <i class="block orange"></i><i class="block orange"></i><i class="block orange"></i><i class="block orange"></i></b>
            </span>
          </span>
        </label>
        <label class="answer-option">
          <input type="radio" name="answer-method" value="choices">
          <span>すうじをえらぶ</span>
          <span class="method-preview" aria-hidden="true">
            <span><span data-preview-first></span> <span data-preview-operator></span> ? = <span data-preview-result></span></span>
            <span class="preview-choices"><b>2</b><b>3</b><b>4</b></span>
          </span>
        </label>
        <label class="answer-option">
          <input type="radio" name="answer-method" value="input">
          <span>すうじをいれる</span>
          <span class="method-preview" aria-hidden="true">
            <span><span data-preview-first></span> <span data-preview-operator></span> ? = <span data-preview-result></span></span>
            <b class="preview-input">3</b>
          </span>
        </label>
      </fieldset>
      <fieldset id="operation-settings">
        <legend>けいさん</legend>
        <div class="operations">
          <label><input type="radio" name="operation" value="addition" checked><span class="operation-option"><span data-operator="+" aria-hidden="true"></span>たしざん</span></label>
          <label><input type="radio" name="operation" value="subtraction"><span class="operation-option"><span data-operator="−" aria-hidden="true"></span>ひきざん</span></label>
        </div>
      </fieldset>
      <form method="dialog"><button id="settings-close" class="utility" type="submit">とじる</button></form>
      <button id="reset-open" type="button">はじめの せっていに もどす</button>
      <p id="offline-ready" class="offline-ready" role="status" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M2 8.5a16 16 0 0 1 3-2M9 5a16 16 0 0 1 13 3.5M5 12.5a11 11 0 0 1 4-2M14 10.2a11 11 0 0 1 5 2.3M8.5 16a5.5 5.5 0 0 1 5.5-1.2M12 20h.01M3 3l18 18"/>
        </svg>
        <span>ブロック 10 は<br>インターネットが なくても あそべます</span>
      </p>
    </dialog>
    <dialog id="reset-settings" class="settings-dialog" aria-labelledby="reset-title" aria-describedby="reset-note">
      <h2 id="reset-title">はじめの せっていに もどす？</h2>
      <p id="reset-note">あそんだ きろくは きえないよ。</p>
      <form method="dialog">
        <button class="utility" type="submit" autofocus>いいえ</button>
        <button id="reset-confirm" class="utility" type="submit">はい</button>
      </form>
    </dialog>
    <dialog id="total-editor" class="settings-dialog" aria-labelledby="editor-title">
      <div class="editor-panel">
        <div class="editor-heading">
          <h2 id="editor-title">あそびたい かずを えらんでね</h2>
          <p id="editor-count" role="status" hidden></p>
        </div>
        <div class="editor-options">
          <div id="editor-numbers" class="editor-numbers" role="group" aria-labelledby="editor-title"></div>
        </div>
        <p id="editor-empty-note" hidden>えらばずに とじると、5 と 10 に もどるよ。</p>
        <form method="dialog"><button class="utility" type="submit" autofocus>とじる</button></form>
      </div>
    </dialog>
    <div id="effects" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
